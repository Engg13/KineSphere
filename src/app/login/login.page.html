<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">

    <!-- BRAND -->
    <div class="brand-section">
      <div class="brand-icon-wrapper">
        <ion-icon name="fitness-outline"></ion-icon>
      </div>
      <h1 class="brand-name">KINESPHERE</h1>
      <p class="brand-tagline">Panel profesional</p>
    </div>

    <!-- FORM -->
    <div class="form-section">
      <h2 class="form-title">Acceso Administrador</h2>

      <form (ngSubmit)="login()">

        <!-- EMAIL -->
        <div class="input-group">
          <label class="input-label">Email</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              class="custom-input"
              placeholder="tu@email.com"
              [(ngModel)]="email"
              name="email"
              required>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <label class="input-label">Contraseña</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              [type]="showPwd ? 'text' : 'password'"
              class="custom-input"
              placeholder="Tu contraseña"
              [(ngModel)]="password"
              name="password"
              required>
            <button type="button" class="toggle-pwd-btn" (click)="togglePwd()">
              <ion-icon [name]="showPwd ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          [disabled]="isLoading">

          @if (isLoading) {
            <ion-spinner name="crescent" class="btn-spinner"></ion-spinner>
          } @else {
            Ingresar
          }

        </button>
      </form>
    </div>

    <!-- FOOTER -->
    <div class="login-footer">
      <small>KineSphere Admin</small>
    </div>

  </div>
</ion-content>
