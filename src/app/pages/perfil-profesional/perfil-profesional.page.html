<ion-content [fullscreen]="true">
  <div class="perfil-wrapper">
    <!-- HEADER -->
    <div class="perfil-header">
      <div class="header-top">
        <button class="back-btn" (click)="volver()">
          <ion-icon name="arrow-back"></ion-icon>
        </button>
        <h1 class="header-title">Mi Perfil</h1>
        <div class="header-spacer"></div>
      </div>
      <div class="avatar-section">
        <div class="avatar-circle">
          <ion-icon name="person"></ion-icon>
        </div>
        <p class="avatar-username">{{ username }}</p>
      </div>
    </div>

    <!-- NOMBRE SECTION -->
    <div class="section-card">
      <div class="section-title-row">
        <ion-icon name="create-outline" class="section-icon"></ion-icon>
        <h3>Nombre Profesional</h3>
      </div>
      <p class="section-description">Este nombre aparece en los informes PDF y en el dashboard</p>
      <div class="input-group">
        <input
          type="text"
          class="perfil-input"
          [(ngModel)]="nombreCompleto"
          placeholder="Ej: Klgo. Juan Perez"
          maxlength="50"
        />
      </div>
      <button class="btn-primary" (click)="guardarNombre()">
        <ion-icon name="checkmark-outline"></ion-icon>
        <span>Guardar Nombre</span>
      </button>
    </div>

    <!-- PASSWORD SECTION -->
    <div class="section-card">
      <div class="section-title-row">
        <ion-icon name="lock-closed-outline" class="section-icon"></ion-icon>
        <h3>Cambiar Contrasena</h3>
      </div>
      <p class="section-description">La contrasena debe ser 4 digitos numericos</p>

      <div class="input-group">
        <label class="input-label">Contrasena actual</label>
        <input
          type="password"
          class="perfil-input"
          [(ngModel)]="passwordActual"
          placeholder="****"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]*"
        />
      </div>

      <div class="input-group">
        <label class="input-label">Nueva contrasena</label>
        <input
          type="password"
          class="perfil-input"
          [(ngModel)]="passwordNueva"
          placeholder="****"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]*"
        />
      </div>

      <div class="input-group">
        <label class="input-label">Confirmar nueva contrasena</label>
        <input
          type="password"
          class="perfil-input"
          [(ngModel)]="passwordConfirmar"
          placeholder="****"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]*"
        />
      </div>

      <button class="btn-primary" (click)="cambiarPassword()">
        <ion-icon name="key-outline"></ion-icon>
        <span>Cambiar Contrasena</span>
      </button>
    </div>

    <!-- SESSION INFO -->
    <div class="section-card session-info">
      <div class="info-row">
        <span class="info-label">Usuario</span>
        <span class="info-value">{{ username }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Nombre</span>
        <span class="info-value">{{ nombreCompleto }}</span>
      </div>
    </div>

    <!-- LOGOUT BUTTON -->
    <button class="btn-logout" (click)="cerrarSesion()">
      <ion-icon name="log-out-outline"></ion-icon>
      <span>Cerrar Sesion</span>
    </button>
  </div>
</ion-content>
