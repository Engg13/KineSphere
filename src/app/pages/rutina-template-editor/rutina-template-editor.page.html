<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()" fill="clear">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nueva plantilla</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="editor-container">

    <!-- NOMBRE Y DESCRIPCION -->

    <div class="section-card">

      <input
        class="rutina-name-input"
        type="text"
        placeholder="Nombre de la rutina"
        [(ngModel)]="rutina.nombre" />

      <textarea
        class="rutina-desc-input"
        placeholder="Descripcion (opcional)"
        rows="2"
        [(ngModel)]="rutina.descripcion">
      </textarea>

    </div>

    <!-- EJERCICIOS HEADER -->

    <div class="section-header" *ngIf="rutina.ejercicios.length">
      <span class="section-label">Ejercicios</span>
      <span class="section-count">{{ rutina.ejercicios.length }}</span>
    </div>

    <!-- LISTA DE EJERCICIOS -->

    <div class="ejercicios-stack">

      <div
        class="ejercicio-item"
        *ngFor="let ej of rutina.ejercicios; let i = index">

        <div class="ej-order">{{ ej.orden }}</div>

        <div class="ej-body">

          <span class="ej-name">{{ ej.nombre }}</span>

          <div class="ej-params">

            <div class="param-group">
              <label>Series</label>
              <input
                type="number"
                min="1"
                [(ngModel)]="ej.series" />
            </div>

            <div class="param-group">
              <label>Reps</label>
              <input
                type="number"
                min="1"
                [(ngModel)]="ej.repeticiones" />
            </div>

          </div>

        </div>

        <button class="ej-delete" (click)="eliminarEjercicio(i)">
          <ion-icon name="trash-outline"></ion-icon>
        </button>

      </div>

    </div>

    <!-- AGREGAR EJERCICIO -->

    <button class="add-exercise-btn" (click)="abrirSelectorEjercicios()">
      <ion-icon name="add-circle-outline"></ion-icon>
      <span>Agregar ejercicio</span>
    </button>

    <!-- GUARDAR -->

    <button
      class="save-btn"
      [class.disabled]="!rutina.nombre.trim()"
      [disabled]="!rutina.nombre.trim()"
      (click)="guardar()">
      Guardar plantilla
    </button>

  </div>

  <!-- MODAL VIDEO -->

  <ion-modal
    [isOpen]="!!videoPreview"
    (didDismiss)="cerrarPreview()">

    <ng-template>

      <ion-header>
        <ion-toolbar>
          <ion-title>Video ejercicio</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarPreview()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="video-wrapper">
          <iframe
            *ngIf="videoPreview"
            [src]="videoPreview"
            width="100%"
            height="250"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>
      </ion-content>

    </ng-template>

  </ion-modal>

</ion-content>
