<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()" fill="clear">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- LOADING -->

  @if (cargando) {
    <div class="loading-container">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando...</p>
    </div>
  }

  <!-- EDITOR -->

  @if (!cargando && rutina) {

    <div class="editor-container">

      <app-rutina-builder
        [rutina]="rutina"
        (rutinaChange)="onRutinaChange($event)">
      </app-rutina-builder>

      <!-- SAVE BUTTON -->

      <button
        class="save-btn"
        [class.disabled]="!rutina.nombre?.trim() || guardando"
        [disabled]="!rutina.nombre?.trim() || guardando"
        (click)="guardar()">

        @if (guardando) {
          <ion-spinner name="crescent" color="light"></ion-spinner>
        } @else {
          {{ botonGuardar }}
        }

      </button>

    </div>

  }

</ion-content>
