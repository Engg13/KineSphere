<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Asignar rutina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="assign-container">

    <!-- SELECTOR TIPO -->

    <div class="tipo-selector">

      <button
        class="tipo-btn"
        [class.active]="tipoSeleccionado === 'clinica'"
        (click)="seleccionarTipo('clinica')">

        <ion-icon name="barbell-outline"></ion-icon>
        Rutina clínica

      </button>

      <button
        class="tipo-btn"
        [class.active]="tipoSeleccionado === 'domiciliaria'"
        (click)="seleccionarTipo('domiciliaria')">

        <ion-icon name="home-outline"></ion-icon>
        Rutina domiciliaria

      </button>

    </div>

    <!-- SECTION HEADER -->

    <div class="section-header">
      <span class="section-label">Plantillas disponibles</span>
      <span class="section-count">{{ templates.length }}</span>
    </div>

    <!-- TEMPLATE LIST -->

    <div class="templates-list">

      <ng-container *ngFor="let template of templates">

        <button
          class="template-card"
          [class.selected]="templateSeleccionado?.id === template.id"
          [class.disabled]="!tipoSeleccionado"
          (click)="tipoSeleccionado && seleccionarTemplate(template)">

          <div class="template-icon">
            <ion-icon name="document-text-outline"></ion-icon>
          </div>

          <div class="template-info">

            <span class="template-name">
              {{ template.nombre }}
            </span>

            <span class="template-desc" *ngIf="template.descripcion">
              {{ template.descripcion }}
            </span>

            <span class="template-meta">
              {{ template.ejercicios.length }} ejercicios
            </span>

          </div>

          <div
            class="template-check"
            *ngIf="templateSeleccionado?.id === template.id">

            <ion-icon
              name="checkmark-circle"
              color="primary">
            </ion-icon>

          </div>

        </button>

        <!-- EJERCICIOS PREVIEW -->

        <div
          class="template-exercises"
          *ngIf="templateSeleccionado?.id === template.id">

          <ol>

            <li *ngFor="let ej of template.ejercicios.slice(0,4)">
              {{ ej.nombre }}
            </li>

            <li *ngIf="template.ejercicios.length > 4">
              +{{ template.ejercicios.length - 4 }} más
            </li>

          </ol>

        </div>

      </ng-container>

    </div>

    <!-- EMPTY STATE -->

    <div class="empty-state" *ngIf="templates.length === 0">
      <ion-icon name="document-outline"></ion-icon>
      <p>No hay plantillas creadas</p>
      <span>Crea una plantilla primero para poder asignarla</span>
    </div>

    <!-- ASSIGN BUTTON -->

    <button
      class="assign-btn"
      [class.disabled]="!templateSeleccionado"
      [disabled]="!templateSeleccionado || !tipoSeleccionado"
      (click)="asignar()">
      Asignar rutina al paciente
    </button>

  </div>

</ion-content>
