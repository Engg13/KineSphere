<ion-header class="picker-header">
  <ion-toolbar>
    <ion-title>Biblioteca de ejercicios</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" fill="clear">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="search-wrapper">
    <ion-searchbar
      placeholder="Buscar por nombre..."
      [(ngModel)]="terminoBusqueda"
      (ionInput)="filtrarEjercicios()"
      [debounce]="200"
      mode="ios">
    </ion-searchbar>
  </div>
</ion-header>

<ion-content>

  <!-- FILTRO CATEGORIAS -->

  <div class="categorias-scroll">
    <button
      *ngFor="let cat of categorias"
      class="cat-chip"
      [class.active]="categoriaFiltro === cat.valor"
      (click)="filtrarPorCategoria(cat.valor)">
      <ion-icon [name]="cat.icono"></ion-icon>
      <span>{{ cat.nombre }}</span>
    </button>
  </div>

  <!-- CONTADOR -->

  <div class="results-count">
    {{ ejerciciosFiltrados.length }} ejercicios
  </div>

  <!-- LISTA EJERCICIOS -->

  <div class="ejercicios-list">

    <button
      *ngFor="let ej of ejerciciosFiltrados"
      class="ejercicio-card"
      (click)="seleccionar(ej)">

      <div class="ej-thumb"
        *ngIf="ej.videoThumbnail || ej.imagenUrl; else iconPlaceholder">
        <img [src]="ej.videoThumbnail || ej.imagenUrl" [alt]="ej.nombre" />
      </div>

      <ng-template #iconPlaceholder>
        <div class="ej-thumb placeholder">
          <ion-icon name="barbell-outline"></ion-icon>
        </div>
      </ng-template>

      <div class="ej-info">
        <span class="ej-name">{{ ej.nombre }}</span>
        <span class="ej-meta" *ngIf="ej.musculoPrincipal || ej.zonaCorporal">
          {{ ej.musculoPrincipal || ej.zonaCorporal }}
        </span>
        <span class="ej-badge" *ngIf="ej.categoria">
          {{ ej.categoria }}
        </span>
      </div>

      <div class="ej-add">
        <ion-icon name="add-circle" color="primary"></ion-icon>
      </div>

    </button>

  </div>

  <!-- EMPTY STATE -->

  <div class="empty-state" *ngIf="ejerciciosFiltrados.length === 0">
    <ion-icon name="search-outline"></ion-icon>
    <p>No se encontraron ejercicios</p>
    <span>Intenta con otro termino o categoria</span>
  </div>

</ion-content>
