<div class="rutina-card" style="padding-bottom: 40px;">

  <!-- HEADER -->

  <div class="rutina-header">

    <!-- NOMBRE -->

    <h3 *ngIf="!editando">
      {{ rutina?.nombre || 'Rutina activa' }}
    </h3>

    <ion-input
      *ngIf="editando"
      [(ngModel)]="rutina.nombre"
      label="Nombre rutina"
      labelPlacement="stacked">
    </ion-input>

    <div class="rutina-actions">

      <!-- EDITAR -->

      <ion-button
        size="small"
        fill="outline"
        *ngIf="!editando"
        (click)="activarEdicion()">
        Editar
      </ion-button>

      <!-- CONVERTIR A PLANTILLA -->

      <ion-button
        size="small"
        fill="outline"
        (click)="convertirAPlantilla()">

        <ion-icon name="copy-outline" slot="start"></ion-icon>
        Plantilla

      </ion-button>

      <!-- CANCELAR -->

      <ion-button
        size="small"
        fill="outline"
        color="medium"
        *ngIf="editando"
        (click)="cancelarEdicion()">
        Cancelar
      </ion-button>

      <!-- GUARDAR -->

      <ion-button
        size="small"
        color="success"
        *ngIf="editando"
        (click)="guardarCambios()">
        Guardar
      </ion-button>

      <!-- AGREGAR EJERCICIO -->

      <ion-button
        size="small"
        fill="outline"
        *ngIf="editando"
        (click)="abrirSelectorEjercicios()">

        <ion-icon name="add" slot="start"></ion-icon>
        Ejercicio

      </ion-button>

    </div>

  </div>

  <!-- LISTA EJERCICIOS -->

  <ion-list>

    <ion-reorder-group
      [disabled]="!editando"
      (ionItemReorder)="reordenarEjercicios($event)">

      @for (ej of rutina?.ejercicios; track ej.ejercicioId) {

        <ion-item>

          <ion-reorder slot="start" *ngIf="editando"></ion-reorder>

          <ion-label>

            <h2>{{ ej.nombre }}</h2>

            <!-- LECTURA -->

            <p *ngIf="!editando">
              {{ ej.series }} series • {{ ej.repeticiones }} reps
            </p>

            <!-- EDICIÓN -->

            <ion-grid *ngIf="editando">

              <ion-row>

                <ion-col size="6">

                  <ion-input
                    type="number"
                    label="Series"
                    labelPlacement="stacked"
                    [(ngModel)]="ej.series">
                  </ion-input>

                </ion-col>

                <ion-col size="6">

                  <ion-input
                    type="number"
                    label="Reps"
                    labelPlacement="stacked"
                    [(ngModel)]="ej.repeticiones">
                  </ion-input>

                </ion-col>

              </ion-row>

            </ion-grid>

          </ion-label>

          <ion-buttons slot="end" *ngIf="editando">

            <ion-button
              fill="clear"
              color="primary"
              (click)="duplicarEjercicio(ej.ejercicioId)">
              <ion-icon name="copy-outline"></ion-icon>
            </ion-button>

            <ion-button
              fill="clear"
              color="danger"
              (click)="eliminarEjercicio(ej.ejercicioId)">
              <ion-icon name="trash-outline"></ion-icon>
            </ion-button>

          </ion-buttons>

        </ion-item>

      }

    </ion-reorder-group>

  </ion-list>

</div>
